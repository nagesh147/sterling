<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sterling — Crypto Trading Signals</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── DARK (default) — Professional trading terminal ── */
      :root, [data-theme="dark"] {
        --bg:           #070d1a;   /* deep navy */
        --bg-card:      #0d1526;   /* card surface */
        --bg-input:     #111e33;   /* input / code bg */
        --border:       #1a2d4a;   /* subtle border */
        --border-light: #243d60;   /* lighter border */
        --text-primary: #d4e4f7;   /* ice blue-white */
        --text-muted:   #7a9ec2;   /* muted blue-grey */
        --text-dim:     #3d5a7a;   /* dim */
        --text-faint:   #1e3350;   /* very dim */
        --accent:       #00d4aa;   /* teal green — BUY */
        --danger:       #ff4757;   /* vivid red — SELL/SL */
        --warning:      #ffa502;   /* amber — TP/caution */
        --blue:         #3d9ef0;   /* information blue */
        --purple:       #a855f7;   /* positional purple */
      }

      /* ── LIGHT — clean white with navy accents ── */
      [data-theme="light"] {
        --bg:           #f0f4fa;
        --bg-card:      #ffffff;
        --bg-input:     #e8eef8;
        --border:       #c8d8ec;
        --border-light: #dce8f4;
        --text-primary: #0d1a2e;
        --text-muted:   #3d6080;
        --text-dim:     #7a9ab8;
        --text-faint:   #b0c4d8;
        --accent:       #00a87a;
        --danger:       #e02020;
        --warning:      #c07000;
        --blue:         #1a6ec0;
        --purple:       #7c3aed;
      }

      body {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        transition: background 0.2s, color 0.2s;
        font-size: 13px;
        line-height: 1.5;
      }

      /* Scrollbar — matches dark theme */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

      /* Selection */
      ::selection { background: #00d4aa33; color: var(--text-primary); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
