<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sterling — Crypto Trading Signals</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── DARK (default) — Professional trading terminal ── */
      :root, [data-theme="dark"] {
        --bg:           #070d1a;   /* deep navy */
        --bg-card:      #0d1526;   /* card surface */
        --bg-input:     #111e33;   /* input / code bg */
        --border:       #1a2d4a;   /* subtle border */
        --border-light: #243d60;   /* lighter border */
        --text-primary: #d4e4f7;   /* ice blue-white */
        --text-muted:   #7a9ec2;   /* muted blue-grey */
        --text-dim:     #3d5a7a;   /* dim */
        --text-faint:   #1e3350;   /* very dim */
        --accent:       #00d4aa;   /* teal green — BUY */
        --danger:       #ff4757;   /* vivid red — SELL/SL */
        --warning:      #ffa502;   /* amber — TP/caution */
        --blue:         #3d9ef0;   /* information blue */
        --purple:       #a855f7;   /* positional purple */
      }

      /* ── LIGHT — clean white with navy accents ── */
      [data-theme="light"] {
        --bg:           #f0f4fa;
        --bg-card:      #ffffff;
        --bg-input:     #e8eef8;
        --border:       #c8d8ec;
        --border-light: #dce8f4;
        --text-primary: #0d1a2e;
        --text-muted:   #3d6080;
        --text-dim:     #7a9ab8;
        --text-faint:   #b0c4d8;
        --accent:       #00a87a;
        --danger:       #e02020;
        --warning:      #c07000;
        --blue:         #1a6ec0;
        --purple:       #7c3aed;
      }

      body {
        font-family: var(--app-font, 'Inter', system-ui, sans-serif);
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        transition: background 0.2s, color 0.2s;
        font-size: 13px;
        line-height: 1.5;
      }

      /* Scrollbar — matches dark theme */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

      /* Selection */
      ::selection { background: #00d4aa33; color: var(--text-primary); }
    </style>
    <!-- App font picker: loads 14 popular UI fonts (the 15th option is system-ui
         which needs no download) at the three weights we use (400/600/700, plus
         500 for Roboto / no 600 for Lato). The chosen family is stored in
         localStorage as 'app.font.stack' and applied to --app-font; the early
         script below sets it before paint so there's no flash. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;600;700&family=DM+Sans:wght@400;600;700&family=Manrope:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Outfit:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Lato:wght@400;700&family=Work+Sans:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
    <script>
      try {
        var s = localStorage.getItem('app.font.stack');
        if (s) document.documentElement.style.setProperty('--app-font', s);
      } catch (e) { /* private mode / SSR */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
