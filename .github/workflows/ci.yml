name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -q --tb=short
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          DEFAULT_UNDERLYING: BTC
          LOG_LEVEL: WARNING

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Run Vitest
        working-directory: frontend
        run: npx vitest run --coverage=false
        env:
          VITE_API_BASE_URL: http://localhost:8000

  e2e:
    name: E2E Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [frontend-typecheck]
    strategy:
      fail-fast: false
      matrix:
        # Three spec files — do not shard. Parity is covered by parity-matrix,
        # not by duplicating this job. Artifact names must not contain '/'.
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --silent
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Start backend
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          DEFAULT_UNDERLYING: BTC
          LOG_LEVEL: WARNING
        run: |
          set -euo pipefail
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/uvicorn.pid)" 2>/dev/null; then cat /tmp/backend.log; exit 1; fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Run Playwright E2E
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
          CI: "true"
        run: npx playwright test --project=${{ matrix.project }} --reporter=list
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Dump backend log
        if: failure()
        run: cat /tmp/backend.log || true

  orb-options-gate:
    name: ORB Automated Options Safety Gate
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run ORB strategy, replay, execution and validation tests
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q \
            tests/strategies/test_nifty_orb_option_replay.py \
            tests/strategies/test_nifty_orb_options.py \
            tests/services/test_nifty_orb_execution.py \
            tests/services/test_nifty_orb_execution_safety.py \
            tests/services/test_nifty_orb_execution_e2e.py \
            tests/services/test_nifty_orb_daily_loss_integration.py \
            tests/services/test_nifty_orb_config_load.py \
            tests/services/test_nifty_orb_scanner_internals.py \
            tests/engines/test_nifty_orb_validation.py \
            tests/engines/test_nifty_orb_options.py \
            tests/engines/test_nifty_orb_options_contracts.py \
            tests/engines/test_nifty_orb_plan_matches_executor.py \
            tests/engines/test_nifty_orb_universe_repaint.py \
            tests/api/test_nifty_orb_replay_api.py \
            tests/test_live_safety.py
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          LOG_LEVEL: WARNING

  parity-matrix:
    name: Parity Matrix (${{ matrix.parity }})
    runs-on: ubuntu-latest
    needs: [backend-tests]
    strategy:
      fail-fast: false
      matrix:
        parity: [directional, kite]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Run parity tests
        working-directory: backend
        run: python -m pytest tests/test_common_trailing.py -q --disable-warnings -m "${{ matrix.parity }}" --tb=line
