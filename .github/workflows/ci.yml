name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -q --tb=short
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          DEFAULT_UNDERLYING: BTC
          LOG_LEVEL: WARNING

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Run Vitest
        working-directory: frontend
        run: npx vitest run --coverage=false
        env:
          VITE_API_BASE_URL: http://localhost:8000

  e2e:
    name: E2E Playwright (${{ matrix.project }} shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [frontend-typecheck]
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
        parity: [directional, kite]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --silent
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Start backend
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          DEFAULT_UNDERLYING: BTC
          LOG_LEVEL: WARNING
        run: |
          set -euo pipefail
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/uvicorn.pid)" 2>/dev/null; then cat /tmp/backend.log; exit 1; fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Run Playwright E2E
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
          CI: "true"
          PARITY_ENGINE: ${{ matrix.parity }}
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} --reporter=list
      - name: Run parity tests
        working-directory: backend
        run: python -m pytest tests/test_common_trailing.py -q --disable-warnings -m "${{ matrix.parity }}" --tb=line
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}-${{ matrix.shard }}-${{ matrix.parity }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Dump backend log
        if: failure()
        run: cat /tmp/backend.log || true

  orb-options-gate:
    name: ORB Automated Options Safety Gate
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run ORB strategy, replay and execution safety tests
        working-directory: backend
        run: >-
          pytest -q
          tests/strategies/test_nifty_orb_option_replay.py
          tests/strategies/test_nifty_orb_options.py
          tests/services/test_nifty_orb_execution.py
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          LOG_LEVEL: WARNING

  parity-matrix:
    name: Parity Matrix (${{ matrix.parity }})
    runs-on: ubuntu-latest
    needs: [backend-tests]
    strategy:
      fail-fast: false
      matrix:
        parity: [directional, kite]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Run parity tests
        working-directory: backend
        run: python -m pytest tests/test_common_trailing.py -q --disable-warnings -m "${{ matrix.parity }}" --tb=line
