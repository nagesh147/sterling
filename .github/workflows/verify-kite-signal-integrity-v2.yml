name: Verify Kite CE PE signal integrity

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/signal-integrity-v2/**'
      - '.github/workflows/verify-kite-signal-integrity-v2.yml'
      - 'backend/app/engines/sterling_kite_engine/**'
      - 'backend/app/services/kite_engine/**'
      - 'backend/tests/engines/sterling_kite_engine/**'
      - 'frontend