name: Verify Kite CE PE signal integrity v3

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/signal-integrity-v2/**'
      - '.github/workflows/verify-kite-signal-integrity-v3.yml'
      - 'backend/app/engines/sterling_kite_engine/**'
      - 'backend/app/services/kite_engine/**'
      - 'backend/tests/engines/sterling_kite_engine/**'
      - 'frontend/src/components/charts/**'
      - 'frontend/src/components/kite/SterlingKiteEnginePane.tsx'
      - 'frontend/src/types/kiteEngine.ts'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'fix/kite-ce-pe-signal-integrity-verification' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply reviewed hardening
        run: python .github/signal-integrity-v2/apply.py
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify backend signal semantics
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
        run: |
          pytest tests/engines/sterling_kite_engine/test_scanner.py -q --tb=short -k 'not derivative_contract_never_treats_three_red_as_an_entry'
          pytest tests/engines/sterling_kite_engine/test_scanner.py -q --tb=short -k 'derivative_contract_never_treats_three_red_as_an_entry'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Verify chart marker semantics
        working-directory: frontend
        run: npx vitest run src/components/charts/signalMarkerLogic.test.ts --coverage=false
      - name: Remove temporary verifier
        run: |
          rm -rf .github/signal-integrity-v2
          rm -f .github/workflows/verify-kite-signal-integrity-v2.yml
          rm -f .github/workflows/verify-kite-signal-integrity-v3.yml
      - name: Commit verified source
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || 'fix/kite-ce-pe-signal-integrity-verification' }}
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'fix(kite): enforce contract-local CE PE entry markers'
          git push origin HEAD:${TARGET_BRANCH}
