name: Verify Kite expiry series selection

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/expiry-series/**'
      - '.github/workflows/verify-kite-expiry-series.yml'
      - 'backend/app/services/kite_engine/**'
      - 'backend/app/engines/sterling_kite_engine/**'
      - 'backend/tests/engines/sterling_kite_engine/**'
      - 'frontend/src/components/kite/SterlingKiteEnginePane.tsx'
      - 'frontend/src/types/kiteEngine.ts'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'fix/kite-expiry-series-production' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply base expiry-series changes
        id: apply_base
        continue-on-error: true
        run: |
          python .github/expiry-series/apply.py > /tmp/apply.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/apply.log
          exit "$status"
      - name: Upload base patch diagnostics
        if: steps.apply_base.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: expiry-apply-error
          path: /tmp/apply.log
      - name: Stop after base patch failure
        if: steps.apply_base.outcome == 'failure'
        run: exit 1
      - name: Apply final expiry-series changes
        run: python .github/expiry-series/finalize.py
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify strike and scanner behavior
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
        run: |
          pytest tests/engines/sterling_kite_engine/test_strikes.py -q --tb=short
          pytest tests/engines/sterling_kite_engine/test_scanner.py -q --tb=short
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Verify frontend types
        working-directory: frontend
        run: npx tsc --noEmit --pretty false
      - name: Remove temporary verifier
        run: |
          rm -rf .github/expiry-series
          rm -f .github/workflows/verify-kite-expiry-series.yml
      - name: Commit verified source
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || 'fix/kite-expiry-series-production' }}
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'fix(kite): deliver option expiry series resolver'
          git push origin HEAD:${TARGET_BRANCH}
