name: Verify Kite expiry series production fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'fix/kite-expiry-series-production' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Write production changes directly
        id: direct_fix
        continue-on-error: true
        run: |
          set -o pipefail
          {
            base64 -d .github/expiry-series/direct_fix.py.gz.b64 | gzip -d > /tmp/direct_fix.py
            python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/direct_fix.py')
          text = p.read_text()
          old = '''replace_once(
              SCHEMAS,
              \'''    exit_state: Optional[str] = None
          \''',
              \'''    exit_state: Optional[str] = None
              resolution_note: Optional[str] = None
          \''',
          )'''
          new = '''replace_once(
              SCHEMAS,
              \'''    alignment: Optional[AlignmentChip] = None
              exit_state: Optional[str] = None
          \''',
              \'''    alignment: Optional[AlignmentChip] = None
              exit_state: Optional[str] = None
              resolution_note: Optional[str] = None
          \''',
          )'''
          if old not in text:
              raise RuntimeError('resolution-note patch block missing')
          p.write_text(text.replace(old, new, 1))
          PY
            python /tmp/direct_fix.py
          } > /tmp/direct-fix.log 2>&1
          status=$?
          cat /tmp/direct-fix.log
          exit "$status"
      - name: Upload direct-fix diagnostics
        if: steps.direct_fix.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: direct-fix-error
          path: /tmp/direct-fix.log
      - name: Stop after direct-fix failure
        if: steps.direct_fix.outcome == 'failure'
        run: exit 1
      - name: Remove temporary delivery machinery
        run: |
          rm -rf .github/expiry-series
          rm -f .github/workflows/verify-kite-expiry-series.yml
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify backend behavior
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
        run: |
          pytest tests/engines/sterling_kite_engine/test_strikes.py -q --tb=short
          pytest tests/engines/sterling_kite_engine/test_scanner.py -q --tb=short
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Verify frontend types
        working-directory: frontend
        run: npx tsc --noEmit --pretty false
      - name: Commit verified production code
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || 'fix/kite-expiry-series-production' }}
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(kite): resolve listed option contracts across selected series'
          git push origin HEAD:${TARGET_BRANCH}
