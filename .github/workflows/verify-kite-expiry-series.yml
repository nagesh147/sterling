name: Verify Kite expiry series production fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'fix/kite-expiry-series-production' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Write production changes directly
        run: |
          base64 -d .github/expiry-series/direct_fix.py.gz.b64 | gzip -d > /tmp/direct_fix.py
          python /tmp/direct_fix.py
          rm -rf .github/expiry-series
          rm -f .github/workflows/verify-kite-expiry-series.yml
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify backend behavior
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
        run: |
          pytest tests/engines/sterling_kite_engine/test_strikes.py -q --tb=short
          pytest tests/engines/sterling_kite_engine/test_scanner.py -q --tb=short
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Verify frontend types
        working-directory: frontend
        run: npx tsc --noEmit --pretty false
      - name: Commit verified production code
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || 'fix/kite-expiry-series-production' }}
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(kite): resolve listed option contracts across selected series'
          git push origin HEAD:${TARGET_BRANCH}
