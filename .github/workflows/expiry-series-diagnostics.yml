name: Expiry Series Diagnostics

on:
  push:
    branches: [fix/kite-expiry-series-production]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci --silent
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== BACKEND FOCUSED ==='
            cd backend
            pytest tests/engines/sterling_kite_engine/test_strikes.py tests/engines/sterling_kite_engine/test_universe.py tests/engines/sterling_kite_engine/test_expiry_source_of_truth.py tests/engines/sterling_kite_engine/test_expiry_series_runtime.py -q --tb=short
            echo "focused_exit=$?"
            echo '=== BACKEND FIRST FULL FAILURE ==='
            pytest tests/ -q -x --tb=short
            echo "backend_exit=$?"
            cd ../frontend
            echo '=== TYPESCRIPT ==='
            npx tsc --noEmit
            echo "tsc_exit=$?"
            echo '=== VITEST FIRST FAILURE ==='
            npx vitest run --coverage=false --bail=1
            echo "vitest_exit=$?"
          } > ../diagnostics.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: expiry-series-diagnostics
          path: diagnostics.txt
          retention-days: 1
