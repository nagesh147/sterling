name: Apply signal integrity fix

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - '.github/signal-integrity/**'
      - '.github/workflows/apply-signal-integrity-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kite-signal-integrity-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply reviewed patches
        run: |
          python .github/signal-integrity/patch_backend.py
          python .github/signal-integrity/patch_frontend.py
          python .github/signal-integrity/patch_tests.py

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run focused backend regressions
        working-directory: backend
        env:
          ENVIRONMENT: test
          PAPER_TRADING: 'true'
          REAL_PUBLIC_DATA: 'false'
        run: pytest tests/engines/sterling_kite_engine/test_scanner.py -q --tb=short

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent

      - name: Run marker regressions
        working-directory: frontend
        run: npx vitest run src/components/charts/signalMarkerLogic.test.ts --coverage=false

      - name: Type check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Remove one-shot patch machinery
        run: |
          rm -rf .github/signal-integrity
          rm -f .github/workflows/apply-signal-integrity-fix.yml

      - name: Commit verified fix
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'fix(kite): preserve CE/PE per-contract signal integrity [signal-integrity-applied]'
          git push origin HEAD:fix/kite-signal-integrity-audit
