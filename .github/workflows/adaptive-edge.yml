name: Adaptive Edge Boundary

on:
  push:
    branches: [main, dev, feature/adaptive-edge-artifact-resolution]
    paths:
      - "backend/app/engines/adaptive_edge/**"
      - "backend/tests/engines/adaptive_edge/**"
      - "docs/strategy/adaptive-edge/**"
      - ".github/workflows/adaptive-edge.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/engines/adaptive_edge/**"
      - "backend/tests/engines/adaptive_edge/**"
      - "docs/strategy/adaptive-edge/**"
      - ".github/workflows/adaptive-edge.yml"

jobs:
  adaptive-edge-tests:
    name: Adaptive Edge tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Adaptive Edge tests
        run: python -m pytest -q backend/tests/engines/adaptive_edge
        env:
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          LOG_LEVEL: WARNING

      - name: Verify strategy implementation and fail-closed promotion gate
        working-directory: backend
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          PAPER_TRADING: "true"
          REAL_PUBLIC_DATA: "false"
          LOG_LEVEL: WARNING
        run: |
          python - <<'PY'
          from app.engines.adaptive_edge.readiness import assess_strategy_readiness
          from app.engines.adaptive_edge.execution_gate import evaluate_execution_gate
          from app.engines.adaptive_edge.promotion import PromotionStatus

          readiness = assess_strategy_readiness()
          gate = evaluate_execution_gate()

          # Fail-closed: research-only, never executable. Formulas are currently
          # LOCKED (not IMPLEMENTED), so the formula gate fires first; if they
          # later complete, promotion still blocks. Either path must refuse.
          assert readiness.promotion_status is PromotionStatus.RESEARCH_ONLY
          assert not readiness.executable, readiness
          assert not gate.authorized, gate
          assert gate.reason in {
              "strategy_promotion_required",
              "required_strategy_formula_not_implemented",
          }, gate
          print("Adaptive Edge remains fail-closed:",
                f"readiness={readiness.reason} gate={gate.reason}")
          PY

      - name: Check Python syntax
        run: python -m compileall -q backend/app/engines/adaptive_edge
