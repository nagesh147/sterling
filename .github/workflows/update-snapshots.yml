name: Update E2E Visual Baselines

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Note for this baseline update (e.g. "after red bar polish")'
        required: false
        default: 'manual update'

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --silent

      - name: Install Playwright browsers (all for full)
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run e2e with snapshot update
        working-directory: frontend
        env:
          CI: "true"
          UPDATE_SNAPSHOTS: "1"
        run: npx playwright test --update-snapshots --reporter=list || true

      - name: Upload updated snapshots / report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-updated-baselines
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Summary
        run: |
          echo "Baselines updated. Download artifact, review new snapshots in e2e, commit if good."
          echo "Triggered for: ${{ github.event.inputs.note }}"
