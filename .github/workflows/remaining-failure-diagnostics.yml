name: Remaining Failure Diagnostics

on:
  push:
    branches: [fix/kite-expiry-series-production]
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci --silent
      - name: Capture first failures
        shell: bash
        run: |
          set +e
          {
            echo '=== BACKEND FIRST FAILURE ==='
            cd backend
            pytest tests/ -q -x --tb=short
            echo "backend_exit=$?"
            cd ../frontend
            echo '=== FRONTEND FIRST FAILURE ==='
            npx vitest run --coverage=false --bail=1
            echo "frontend_exit=$?"
          } > "$GITHUB_WORKSPACE/remaining-failures.txt" 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-failures
          path: remaining-failures.txt
          if-no-files-found: error
          retention-days: 1
